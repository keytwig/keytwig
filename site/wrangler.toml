# Static assets only (no Worker code). Not deployed yet.
# Custom domain stays off until the domain is chosen (keytwig.dev or keytwig.com):
# then set it here, in astro.config.mjs (`site`), src/lib/site.ts and public/ (robots, sitemap, llms, _headers, security.txt).
name = "keytwig-site"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"

