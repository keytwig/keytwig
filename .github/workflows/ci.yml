name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Use the newer toolchain when required by go.mod.
  GOTOOLCHAIN: auto

jobs:
  test-and-build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Vet
        run: go vet ./...

      - name: Test without cgo
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Test with the race detector
        # Race detection needs cgo and a supported C compiler.
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: Cross-compile release targets
        if: runner.os == 'Linux'
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/keytwig
            done
          done
